name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # Во сколько раз замедлить змейку: 1 = как есть, 2.5 = в 2.5 раза медленнее
  SNAKE_SLOWDOWN: "2.5"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Slow down the snake
        run: |
          python3 - <<'PY'
          import glob, os, re

          factor = float(os.environ["SNAKE_SLOWDOWN"])

          for path in glob.glob("dist/*.svg"):
              with open(path, encoding="utf-8") as f:
                  svg = f.read()
              svg, count = re.subn(
                  r"(\d+(?:\.\d+)?)ms",
                  lambda m: f"{round(float(m.group(1)) * factor)}ms",
                  svg,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(svg)
              print(f"{path}: scaled {count} time values by x{factor}")
              if count == 0:
                  print("::warning::No 'ms' values found in " + path)
          PY

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}